services:
  app:
    image: ghcr.io/djebiapsi/momentum-app:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Résumé des news via Ollama (auto-hébergé). Fallback heuristique si indispo.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    ports:
      - "80:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/momentum-app/.env:/app/.env.host
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: momentum
      POSTGRES_USER: momentum
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momentum"]
      interval: 10s
      timeout: 5s
      retries: 5

  # IB Gateway — activé via le profil "ibkr" : docker compose --profile ibkr up -d
  # Nécessite IB_USERNAME et IB_PASSWORD dans le .env
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    profiles: ["ibkr"]
    labels:
      - "autoheal=true"
    environment:
      TWS_USERID: ${IB_USERNAME:-}
      TWS_PASSWORD: ${IB_PASSWORD:-}
      TRADING_MODE: ${IB_TRADING_MODE:-live}
      TWS_SETTINGS_PATH: /home/ibgateway/Jts
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD:-changeme}
      TWS_ACCEPT_INCOMING: accept
      # Restart quotidien programmé (soft restart IBC : garde la session, PAS de 2FA)
      # Doit tourner AVANT la maintenance forcée IBKR (~minuit ET) pour éviter le crash
      AUTO_RESTART_TIME: "11:30 PM"
      TIME_ZONE: America/New_York
      # Si timeout 2FA, IBC relance la séquence de login au lieu de mourir
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      TWOFA_TIMEOUT_ACTION: restart
    ports:
      - "127.0.0.1:5900:5900"
    networks:
      - internal
    healthcheck:
      # Teste le port 4001 (process Java réel). Si le gateway crashe, ce port tombe
      # même si socat/4003 répond encore → détection fiable du crash.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/4001' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  # Ollama — petit LLM open-source auto-hébergé pour résumer/trier les news.
  # Le modèle (OLLAMA_MODEL, défaut qwen2.5:3b ≈ 2 Go) est pull au 1er usage par
  # l'app. Si ce service est indisponible, le briefing bascule sur un résumé
  # heuristique sans planter. Prévoir ≥4 Go de RAM (sinon qwen2.5:1.5b).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal

  # Autoheal — surveille les containers "unhealthy" et les redémarre automatiquement
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 180
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

  # Traefik — activé via le profil "traefik" quand un domaine est disponible
  # docker compose --profile traefik up -d
  traefik:
    image: traefik:v3
    restart: unless-stopped
    profiles: ["traefik"]
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - internal

volumes:
  postgres_data:
  ollama_data:

networks:
  internal:
    driver: bridge
